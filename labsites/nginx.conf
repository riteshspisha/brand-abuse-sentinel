# BrandSentinel controlled lab (U11). Name-based virtual hosts on the internal
# bs_lab network (docker/lab.compose.yaml). Keep the host list in sync with
# config/lab.yaml (net.lab.hosts) and each site's expected.yaml (tests/unit/test_lab_fixtures.py).
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # The lab never accepts submissions: every form posts into a 405.
    client_max_body_size 1k;

    # User-agent cloaking (luminafoundation-gift.test).
    map $http_user_agent $cloak_root {
        default /srv/labsites/cloaking/benign;
        "~*(HeadlessChrome|Chrome/|Chromium)" /srv/labsites/cloaking/fraud;
    }

    server {
        listen 80 default_server;
        server_name _;
        return 404;
    }

    server {
        listen 80;
        server_name luminafoundation.test;
        root /srv/labsites/official;
    }

    server {
        listen 80;
        server_name dailyledger-news.test;
        root /srv/labsites/news-critical;
    }

    server {
        listen 80;
        server_name lumina-parody.test;
        root /srv/labsites/parody;
    }

    server {
        listen 80;
        server_name lumina-valley-tourism.test;
        root /srv/labsites/unrelated-tourism;
    }

    server {
        listen 80;
        server_name illumina-lounge.test;
        root /srv/labsites/unrelated-lounge;
    }

    server {
        listen 80;
        server_name sunrise-yoga-studio.test;
        root /srv/labsites/unrelated-yoga;
    }

    server {
        listen 80;
        server_name luminafoundatoin.test;
        root /srv/labsites/typosquat-parked;
    }

    server {
        listen 80;
        server_name lumina-foundation-org.test;
        root /srv/labsites/copied-assets;
    }

    server {
        listen 80;
        server_name orin-relief.test;
        root /srv/labsites/image-only;
    }

    server {
        listen 80;
        server_name login-luminafoundation.test;
        root /srv/labsites/js-login;
    }

    server {
        listen 80;
        server_name pay-luminafoundation.test;
        root /srv/labsites/js-payment;
    }

    server {
        listen 80;
        server_name donate-luminafoundation.test;
        root /srv/labsites/donation-fraud;
    }

    server {
        listen 80;
        server_name orin-wellness-partners.test;
        root /srv/labsites/false-association;
    }

    server {
        listen 80;
        server_name lumina-watch-news.test;
        root /srv/labsites/disguised-credential;
    }

    server {
        listen 80;
        server_name go-luminafoundation.test;
        root /srv/labsites/redirects;
        location = /to-metadata { return 302 http://169.254.169.254/latest/meta-data/; }
        location = /to-loopback { return 302 http://127.0.0.1/; }
        location = /chain { return 302 /chain-2; }
        location = /chain-2 { return 302 http://donate-luminafoundation.test/; }
    }

    server {
        listen 80;
        server_name luminafoundation-gift.test;
        root $cloak_root;
        add_header Vary User-Agent always;
    }
}
