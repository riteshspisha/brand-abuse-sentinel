[project]
name = "brandsentinel"
version = "0.1.0"
description = "Local-first brand-abuse detection and triage for the Isha ecosystem"
requires-python = ">=3.12,<3.14"
dependencies = [
    "anyio>=4.4",
    "certifi>=2024.7",
    "cryptography>=43",
    "dnspython>=2.6",
    "dnstwist>=20250130",
    "httpcore>=1.0.5",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "selectolax>=1.0",
    "tldextract>=5.3",  # top_domain_under_public_suffix
    "typer>=0.12",
    "websockets>=13",
]

[project.optional-dependencies]
# Untrusted-media libraries; installed in the sandbox image (M6), not needed before then.
sandbox = [
    "Pillow>=10.4",
    "imagehash>=4.3",
    "zxing-cpp>=2.2",
    "pytesseract>=0.3.10",
]

[project.scripts]
brandsentinel = "brandsentinel.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brandsentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import shared helpers from tests/conftest.py wherever pytest starts.
pythonpath = ["."]
addopts = "--strict-markers -ra"
markers = [
    "security: security-control tests (run on every change to net/ or sandbox/)",
    "docker: needs the rootless Docker sandbox runtime",
    "lab: needs the controlled lab sites",
    "models: needs a running Kev or Laya server",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Unmodified legacy proof of concept, kept for reference only.
extend-exclude = ["legacy"]

[tool.ruff.lint]
# PLE2502 rejects literal bidi control characters (Trojan Source) in code.
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PLE2502"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108"]
