# Development-side checks only: lint, the documentation checks, the offline demo and the
# strict documentation build. No Docker, no lab stack, no model servers, no secrets, no
# deployment, nothing published.
#
# Not here yet: the full offline suite. On GitHub's ubuntu-24.04 runner, 6 of its tests
# fail that pass on the developer machine. They are timing-sensitive or assume no
# rootful Docker daemon (docs/development/testing.md, "CI"). Run it locally. The
# `docker or security` gate (SP3) still runs on the developer's rootless runtime.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.20"
      - name: Install (locked)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Documentation checks and offline demo
        run: uv run pytest tests/unit/test_docs.py tests/integration/test_offline_demo.py
      - name: CLI reference is current
        run: uv run python docs/tools/gen_cli_reference.py --check
      - name: Strict documentation build
        run: uv run --no-project --with-requirements docs/requirements.txt mkdocs build --strict
