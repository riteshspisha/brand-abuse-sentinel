# Development-side checks only: lint, the offline test suite (which includes the
# documentation checks and the offline demo) and the strict documentation build.
# No Docker, no lab stack, no model servers, no secrets, no deployment, nothing published.
# The `docker or security` gate (SP3) still runs on the developer's rootless runtime.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.20"
      - name: Install (locked)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Offline test suite
        run: uv run pytest -m "not docker and not lab and not models"
      - name: CLI reference is current
        run: uv run python docs/tools/gen_cli_reference.py --check
      - name: Strict documentation build
        run: uv run --no-project --with-requirements docs/requirements.txt mkdocs build --strict
