# BrandSentinel configuration. Every key is optional; values shown are defaults.
# Unknown keys are rejected. BRANDSENTINEL_DATA_DIR overrides data_dir.

data_dir: data

# Brand Registry (brands, keywords, domains, exclusions). See registry/brands.yaml.
registry_path: registry/brands.yaml

# Maximum concurrent jobs per pipeline stage.
stages:
  enrich: 8
  fetch: 4
  media: 2
  render: 1
  decision: 1
  # Running jobs of one registrable domain allowed at once per stage, so a domain
  # with many matching subdomains cannot occupy every worker.
  per_domain_enrich: 2
  per_domain_fetch: 1

jobs:
  max_attempts: 3
  # Lease per stage, in seconds. Must exceed the stage's maximum wall time.
  lease_seconds:
    enrich: 120
    fetch: 120
    media: 180
    render: 300
    decision: 120
  default_lease_seconds: 300

# Artifact quotas, in bytes.
artifacts:
  max_blob_bytes: 10485760        # 10 MiB per artifact
  max_case_count: 200
  max_case_bytes: 52428800        # 50 MiB per case
  max_domain_bytes: 209715200     # 200 MiB per registrable domain
  max_store_bytes: 2147483648     # 2 GiB total
  reserve_fraction: 0.1           # kept for strong-strength and manual cases

rawlog:
  flush_every_records: 100
  discovery_rotation: day
  discovery_max_age_days: 365     # discovery log segments and event rows
  min_free_bytes: 1073741824      # 1 GiB; below this the firehose pauses
  # Optional storage of the unmatched CertStream feed. Off by default.
  firehose:
    enabled: false
    max_total_bytes: 2147483648   # 2 GiB
    max_age_days: 7

text:
  max_fact_chars: 4096      # per string in a stored fact
  max_fact_bytes: 262144    # per serialized fact value

discovery:
  certstream:
    enabled: true
    # certstream-server-go full stream; see docker/compose.yaml (profile certstream).
    url: ws://localhost:8080/full-stream
    ping_interval_seconds: 30
    open_timeout_seconds: 15
    max_message_bytes: 4194304    # 4 MiB
    backoff_initial_seconds: 1
    backoff_max_seconds: 60
    dedupe_cache_size: 100000     # recent certificate fingerprints kept in memory
    max_names_per_cert: 1000
    stale_after_seconds: 300      # status reports the feed stale after this
  dnstwist:
    enabled: true
    binary: dnstwist              # name (venv, then PATH) or absolute path
    dictionary: registry/dictionaries/brand-words.dict
    interval_hours: 24
    retry_hours: 1                # after a failed or abandoned sweep
    threads: 8
    # Sweep timeout = timeout_floor_seconds + permutations / resolution_rate_per_second,
    # capped at timeout_max_seconds.
    resolution_rate_per_second: 20
    timeout_floor_seconds: 120
    timeout_max_seconds: 14400
    count_timeout_seconds: 60
    max_permutations: 100000
    max_output_bytes: 67108864    # 64 MiB

# Per-registrable-domain backlog (subdomain flooding control). A domain may have
# this many live jobs per stage; further work is deferred (kept in the store and
# shown by `status`), never dropped, and promoted as its jobs finish. Manual
# submissions bypass the allowance. Initial values; calibrate on live traffic.
scheduling:
  max_queued_per_domain_strong: 16
  max_queued_per_domain_weak: 4
  promote_interval_seconds: 5
  promote_batch: 500
  recheck_after_days: [1, 7]      # re-run enrichment and the static fetch

# Network policy for every connection to an untrusted host (netguard). Only
# public unicast addresses on these ports are ever contacted.
net:
  allowed_ports: [80, 443]
  prefer_ipv6: false
  dns:
    nameservers: []               # empty: the system resolver configuration
    timeout_seconds: 3
    lifetime_seconds: 6
  # Lab mode adds only the pinned lab subnet 172.31.250.0/24 for the listed
  # hostnames. It requires both discovery sources to be disabled. The host-side
  # fetcher refuses lab URLs until the lab proxy transport exists (M4).
  lab:
    enabled: false
    subnet: 172.31.250.0/24
    hosts: {}

# Hardened static fetcher: GET/HEAD only, no cookies, no proxy, pinned DNS,
# per-hop redirect validation, and caps on time and size.
fetch:
  enabled: true
  user_agent: "BrandSentinel/0.1 (brand-protection research)"
  max_redirects: 5
  connect_timeout_seconds: 10
  read_timeout_seconds: 15
  total_timeout_seconds: 30       # whole fetch, all hops
  max_raw_bytes: 5242880          # 5 MiB read from the wire
  max_decoded_bytes: 10485760     # 10 MiB decoded; the stage also caps at artifacts.max_blob_bytes
  max_addresses_tried: 2
  accept_types: [text/html, application/xhtml+xml, text/plain]
  retry_delay_seconds: 300        # before retrying a transient failure

# Passive enrichment: DNS, RDAP, TLS and similarity.
enrich:
  enabled: true
  rdap_bootstrap_url: https://data.iana.org/rdap/dns.json
  rdap_bootstrap_max_age_days: 7
  rdap_max_bytes: 524288          # 512 KiB per RDAP response
  rdap_cache_hours: 24            # shared by every host under a registrable domain
  tls_timeout_seconds: 10
